name: Build fork Linux server

on:
  workflow_dispatch:
  push:
    branches: [main, privacy-kimi]

permissions:
  contents: write

concurrency:
  group: fork-linux-server-${{ github.ref }}
  cancel-in-progress: true

env:
  TURBO_TELEMETRY_DISABLED: "1"
  DO_NOT_TRACK: "1"

jobs:
  linux:
    if: github.repository == 'anpain/bb'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Check deployment scripts
        run: |
          bash -n scripts/server/install.sh
          bash -n scripts/server/update.sh
          node --check scripts/server/verify.mjs
      - uses: actions/setup-node@v4
        with:
          node-version: "22.19.0"
      - name: Install pnpm
        run: npm install --global pnpm@9.15.0 --ignore-scripts
      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Check server types
        run: pnpm exec turbo run typecheck --filter=@bb/server --filter=@bb/host-daemon --filter=@bb/cli --output-logs=new-only
      - name: Test server routes
        run: >-
          pnpm exec turbo run test --filter=@bb/server --output-logs=new-only --
          test/system/telemetry-events.test.ts
          test/system/general-settings.test.ts
          test/system/setup-guide.test.ts
          test/system/provider-states.test.ts
          test/system/execution-options.test.ts
          test/threads/thread-create-helpers.test.ts
          test/threads/thread-plugin-metadata-configure.test.ts
          test/public/public-provider-installations.test.ts
          test/public/public-chat-import.test.ts
          test/public/public-thread-transfer.test.ts
          test/threads/execution-instructions.test.ts
          test/threads/thread-runtime-config.test.ts
      - name: Test workspace and native session transfer
        run: >-
          pnpm exec turbo run test --filter=@bb/host-daemon --filter=bb-plugin-provider-codex --output-logs=new-only --
          workspace-sync.test.ts native-session-transfer.test.ts
          app-server-launch.test.ts bridge.session-signature.test.ts
      - name: Test computer access tool
        run: pnpm exec turbo run test --filter=bb-plugin-browser-automation --output-logs=new-only -- computer.test.ts
      - name: Test Account Pooler routing
        run: >-
          pnpm exec turbo run test --filter=bb-plugin-account-pool --output-logs=new-only --
          src/server.test.ts app.test.tsx
      - name: Test the host provider request limit
        run: >-
          pnpm exec turbo run test --filter=@bb/host-daemon --output-logs=new-only --
          test/command/command-router.test.ts src/provider-cli-removal.test.ts -t 'limits provider checks|provider CLI removal'
      - name: Test provider authentication bridge
        run: >-
          pnpm exec turbo run test --filter=@bb/provider-bridge-acp --output-logs=new-only --
          src/bridge/provider-maintenance.test.ts
          src/bridge/agent-connection.test.ts
      - name: Build and verify the Linux package
        run: pnpm exec turbo run smoke:tarball --filter=bb-app --output-logs=new-only
      - name: Pack server
        working-directory: packages/bb-app
        run: npm pack --pack-destination "$RUNNER_TEMP"
      - uses: actions/upload-artifact@v4
        with:
          name: bb-server-linux-x64
          path: ${{ runner.temp }}/bb-app-*.tgz
          if-no-files-found: error
      - name: Publish verified Linux server package
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          package=("$RUNNER_TEMP"/bb-app-*.tgz)
          node scripts/server/create-version-feed.mjs "${package[0]}" "$RUNNER_TEMP/server-version-linux-x64.json" "$GITHUB_SHA"
          if ! gh release view desktop-latest >/dev/null 2>&1; then
            gh release create desktop-latest --target "$GITHUB_SHA" --title "BB fork builds" --prerelease --notes $'Verified fork builds.\n\n> AGENT GENERATED'
          fi
          gh release upload desktop-latest "${package[0]}" --clobber
          gh release upload desktop-latest "$RUNNER_TEMP/server-version-linux-x64.json" --clobber
